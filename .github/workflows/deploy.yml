name: Deploy to AWS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-west-2
          aws-access-key-id: ${{ fromJson(secrets.AWS_CREDS).aws_access_key_id }}
          aws-secret-access-key: ${{ fromJson(secrets.AWS_CREDS).aws_secret_access_key }}

      - name: Verify AWS CLI
        run: aws sts get-caller-identity

      - name: Deploy to AWS
        run: |
          echo "Ì∫Ä Starting deployment..."
          # terraform init && terraform apply -auto-approve
          # aws s3 cp ./app s3://my-deployment-bucket/ --recursive
          # aws cloudformation deploy --template-file infra.yaml --stack-name my-stack
          echo "‚úÖ Deployment finished."

      # ‚úÖ Send Slack notification
      - name: Notify Slack
        if: always()   # run even if previous steps fail
        run: |
          STATUS="‚úÖ Deployment succeeded!"
          if [ "${{ job.status }}" != "success" ]; then
            STATUS="‚ùå Deployment failed!"
          fi
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$STATUS (branch: $GITHUB_REF)\"}" \
            ${{ secrets.SLACK_WEBHOOK }}
