name: Slack CI/CD Test

on:
  push:
    branches:
      - app
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "íº€ CI/CD pipeline triggered for *${{ github.repository }}* on branch *${{ github.ref_name }}*"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

