name: CI

on:
  workflow_dispatch:   # allows manual/API trigger
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'app'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Run tests
        run: echo "✅ Running CI/CD on branch ${{ github.event.inputs.branch }}"
